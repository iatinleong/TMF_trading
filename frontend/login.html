<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入 - 台指期量化</title>
  <script src="js/supabase.js?v=1"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .login-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      width: 320px;
      max-width: 90vw;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
    }
    .login-card h1 {
      font-size: 18px;
      margin: 0 0 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>台指期量化 登入</h1>
      <div class="form-row">
        <label>帳號 Email</label>
        <input type="email" id="login-email" autocomplete="username" />
      </div>
      <div class="form-row">
        <label>密碼</label>
        <input type="password" id="login-password" autocomplete="current-password" />
      </div>
      <button id="login-btn" class="submit-btn long" type="button" style="width:100%;margin-top:8px">登入</button>
      <div id="login-msg" class="order-msg"></div>
    </div>
  </div>
  <script src="js/auth.js?v=3"></script>
  <script src="js/login.js?v=2"></script>
</body>
</html>
